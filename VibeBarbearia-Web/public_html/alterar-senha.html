<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Alteração da senha do usuário.">
    <meta name="theme-color" content="#0a0a0a">
    <title>Alterar senha · Vibe Barbearia</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/paginas.css">
    <script src="js/tema.js"></script>
</head>
<body class="area-interna" data-pagina="alterar-senha.html">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <div class="app">
        <aside class="sidebar" id="sidebar" aria-label="Menu principal">
            <a class="marca" href="dashboard.html" aria-label="Vibe Barbearia — dashboard">
                <img src="img/logo.svg" alt="" width="38" height="38">
                <span class="marca-texto"><strong>VIBE</strong><small>BARBEARIA</small></span>
            </a>
            <nav aria-label="Seções do sistema">
                <ul class="menu" id="menu"><!-- montado por ui.js conforme o perfil --></ul>
            </nav>
            <div class="usuario-box" id="usuario-box"></div>
            <button type="button" class="btn btn-secundario btn-sair" id="btn-sair">Sair</button>
        </aside>
        <div class="fundo-menu" id="fundo-menu"></div>
        <div class="principal">
            <header class="topbar">
                <button type="button" class="btn-icone btn-menu-app" id="btn-menu" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu"></button>
                <div>
                    <h1>Alterar senha</h1>
                    <p class="subtitulo">Segurança da sua conta</p>
                </div>
                <div class="topbar-acoes">
                    <button type="button" class="btn-icone" data-alternar-tema></button>
                </div>
            </header>
            <main id="conteudo" class="pagina" tabindex="-1">

                <section class="card cartao-estreito" aria-labelledby="senha-titulo">
                    <h2 id="senha-titulo">Alterar senha</h2>
                    <p class="texto-secundario" id="usuario-senha"></p>
                    <form id="form-senha" class="formulario" novalidate>
                        <p class="erro-formulario" tabindex="-1" role="alert"></p>
                        <div class="campo">
                        <label for="s-atual">Senha atual <span class="obrigatorio" aria-hidden="true">*</span></label>
                        <input id="s-atual" name="atual" type="password" required aria-required="true" aria-describedby="erro-atual" autocomplete="current-password">
                        <p class="erro-campo" id="erro-atual" aria-live="polite"></p>
                    </div>
                        <div class="campo">
                        <label for="s-nova">Nova senha <span class="obrigatorio" aria-hidden="true">*</span></label>
                        <input id="s-nova" name="nova" type="password" required aria-required="true" aria-describedby="erro-nova ajuda-nova" autocomplete="new-password">
                        <span class="ajuda" id="ajuda-nova">Mínimo de 3 caracteres e diferente da atual.</span>
                        <p class="erro-campo" id="erro-nova" aria-live="polite"></p>
                    </div>
                        <div class="forca" aria-live="polite"><div class="progresso"><span id="forca-barra" style="width:0%"></span></div><span class="ajuda" id="forca-texto">Força da senha</span></div>
                        <div class="campo">
                        <label for="s-confirmacao">Confirmar nova senha <span class="obrigatorio" aria-hidden="true">*</span></label>
                        <input id="s-confirmacao" name="confirmacao" type="password" required aria-required="true" aria-describedby="erro-confirmacao" autocomplete="new-password">
                        <p class="erro-campo" id="erro-confirmacao" aria-live="polite"></p>
                    </div>
                        <div class="acoes-formulario"><a class="btn btn-secundario" href="dashboard.html">Cancelar</a><button type="submit" class="btn btn-primario">Salvar</button></div>
                    </form>
                </section>
            </main>
            <footer class="rodape-app">Vibe Barbearia © 2026 | Sistema de Gestão Premium</footer>
        </div>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <script src="js/regras.js" defer></script>
    <script src="js/dados-mock.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/servicos.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/paginas/alterar-senha.js" defer></script>
</body>
</html>
